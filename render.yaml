services:
  - type: web
    name: bol-bhai-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      # Render injects PORT itself; the server already reads process.env.PORT
      # (apps/server/src/server.ts), so it is intentionally not set here.
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOWED_ORIGINS
        value: ""
